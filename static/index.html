<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My TODO App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <!-- ヘッダー部分 -->
        <header class="app-header">
            <span class="app-icon">📝</span>
            <h1>My Tasks</h1>
        </header>

        <!-- 入力エリア（カード） -->
        <div class="todo-input-card">
            <div class="input-row">
                <input type="text" id="todoInput" placeholder="新しいタスクを入力...">
            </div>
            
            <div class="input-details-row">
                <!-- ジャンル選択 -->
                <select id="genreSelect">
                    <option value="仕事">💼 仕事</option>
                    <option value="プライベート">🏠 プライベート</option>
                    <option value="学習">📚 学習</option>
                    <option value="その他">📌 その他</option>
                </select>

                <!-- 優先度選択 -->
                <select id="prioritySelect">
                    <option value="高">優先度: 高</option>
                    <option value="中" selected>優先度: 中</option>
                    <option value="低">優先度: 低</option>
                </select>
            </div>

            <!-- 日付管理エリア -->
            <div class="input-dates-section">
                <div class="date-group">
                    <label>開始日: <input type="date" id="startDateInput"></label>
                </div>
                <div class="date-group">
                    <label>完了予定日: <input type="date" id="targetDateInput"></label>
                </div>
                <div class="date-group">
                    <label>締め切り日: <input type="date" id="deadlineDateInput"></label>
                </div>
            </div>

            <!-- リマインド設定エリア -->
            <div class="input-remind-section">
                <span class="section-label">⏰ リマインド設定（締め切り前）</span>
                <div class="remind-inputs">
                    <label>1回目: <input type="number" id="remind1Input" min="0" placeholder="例: 3" style="width: 50px;"> 日前</label>
                    <label>2回目: <input type="number" id="remind2Input" min="0" placeholder="例: 1" style="width: 50px;"> 日前</label>
                </div>
            </div>

            <button id="addBtn">タスクを追加</button>
        </div>

        <!-- TODOリスト一覧が表示される場所 -->
        <ul id="todoList">
            <!-- ここにJavaScriptでタスクが追加されていきます -->
        </ul>
    </div>

    <script src="main.js"></script>
</body>
</html>
